[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-acquisition-engine"
version = "0.1.0"
description = "MCP-First File Acquisition Infrastructure for Autonomous AI Agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "greenlet>=3.0.3",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "mcp>=1.0.0",
    "python-multipart>=0.0.9",
    "filetype>=1.2.0",
    "pyyaml>=6.0.1",
    "cryptography>=42.0.0",
    "yt-dlp>=2024.0.0",
    "gallery-dl>=1.27.0",
    "bencode-py>=4.0.0",
    "playwright>=1.40.0",
    "sse-starlette>=2.0.0",
    "libtorrent>=2.1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "coverage>=7.4.0"
]
production = [
    "asyncpg>=0.29.0"
]

[tool.setuptools.packages.find]
include = ["apps*", "services*", "packages*", "providers*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
