version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: aae-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aae_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your deployment environment}
      POSTGRES_DB: aae_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aae_user -d aae_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: aae-api
    restart: unless-stopped
    command: python -m uvicorn apps.api.app.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+asyncpg://aae_user:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your deployment environment}@db:5432/aae_db
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in your deployment environment}
      ENVIRONMENT: production
      API_BASE_URL: ${API_BASE_URL:?Set API_BASE_URL to the externally reachable API URL}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS to a JSON array of UI origins}
      API_HOST: 0.0.0.0
      API_PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - artifact_data:/app/storage/artifacts
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    container_name: aae-worker
    restart: unless-stopped
    command: python -m services.acquisition_worker.worker
    environment:
      DATABASE_URL: postgresql+asyncpg://aae_user:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your deployment environment}@db:5432/aae_db
    volumes:
      - artifact_data:/app/storage/artifacts
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  artifact_data:
